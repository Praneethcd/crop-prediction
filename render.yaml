services:
  - type: web
    name: agripredict
    runtime: docker
    plan: standard
    region: singapore
    healthCheckPath: /healthz
    autoDeployTrigger: off
    disk:
      name: agripredict-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: SECRET_KEY
        generateValue: true
